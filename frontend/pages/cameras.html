<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câmeras — E.L.O.</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/componentes.css">
    <link rel="stylesheet" href="/css/paginas.css">
</head>
<body>
    <!-- "Minha casa", aba Câmeras. Visual: docs/proposta/03-cameras.png
         Câmeras SIMULADAS: não existe vídeo. A área roxa com o selo
         "SIMULAÇÃO" fica no lugar da imagem. -->
    <div id="cabecalho"></div>

    <main class="container">
        <div class="titulo-pagina">
            <h1>Câmeras</h1>
            <p>Imagens simuladas. Nenhum vídeo real é exibido.</p>
        </div>

        <div id="abas-casa"></div>

        <div id="mensagem"></div>

        <!-- Formulário de câmera (nova ou editar): abre pelo "+" ou por "Editar" -->
        <section class="card painel-formulario oculto" id="painel-formulario">
            <h3 id="titulo-formulario">Nova câmera</h3>
            <form class="formulario" id="formulario-camera">
                <input type="hidden" id="camera-id">
                <div class="campo">
                    <label for="camera-nome">Nome</label>
                    <input type="text" id="camera-nome" placeholder="Ex.: Câmera da varanda" required>
                </div>
                <div class="campo">
                    <label for="camera-comodo">Cômodo</label>
                    <select id="camera-comodo"></select>
                </div>
                <div class="formulario-botoes">
                    <button type="submit" class="botao">Salvar</button>
                    <button type="button" class="botao botao-contorno" id="botao-cancelar">Cancelar</button>
                    <button type="button" class="botao botao-perigo oculto" id="botao-excluir">Excluir</button>
                </div>
            </form>
        </section>

        <div class="grade-3" id="lista-cameras"></div>
    </main>

    <div id="rodape"></div>

    <script src="/js/api.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/casa_comum.js"></script>
    <script src="/js/cameras.js"></script>
</body>
</html>
